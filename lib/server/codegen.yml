schema: "./server/_graphql/joined.graphql"
documents:
  - "./src/**/*.{ts,tsx}"
  - "!./src/__generated__/**"
generates:
  server/_graphql/types.ts:
    config:
      contextType: "../model/types#GlobalContext"
      useTypeImports: true
    plugins:
      - typescript
      - typescript-resolvers
  src/__generated__/graphql/:
    preset: client
