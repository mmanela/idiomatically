services:
  idiomatically:
    profiles: [app]
    image: idiomatically
    build:
      context: .
      dockerfile: Dockerfile.staging
    environment:
      NODE_ENV: development
      DB_CONNECTION: mongodb://mongo:27017
      SERVER_URL: http://127.0.0.1:8000
      MONGO_DB: idiomatically
      GOOGLE_CLIENT_ID: local-development-disabled
      GOOGLE_CLIENT_SECRET: local-development-disabled
      LOCAL_AUTH_ENABLED: "true"
      BETTER_AUTH_SECRET: idiomatically-compose-secret-at-least-thirty-two-characters
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - data-volume:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  data-volume: